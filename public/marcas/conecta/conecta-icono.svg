<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Conecta">
  <!-- Tres nodos conectados: las empresas del grupo, unidas por un mismo canal.
       Las tres figuras son el eco de las tres del logo de Prometeo. -->
  <g stroke="#c6901a" stroke-width="7" stroke-linecap="round">
    <line x1="28" y1="30" x2="72" y2="30"/>
    <line x1="28" y1="30" x2="50" y2="70"/>
    <line x1="72" y1="30" x2="50" y2="70"/>
  </g>
  <circle cx="28" cy="30" r="14" fill="#dcab2f"/>
  <circle cx="72" cy="30" r="14" fill="#d29d1b"/>
  <circle cx="50" cy="70" r="14" fill="#ab7211"/>
</svg>
